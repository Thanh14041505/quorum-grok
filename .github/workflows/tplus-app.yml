name: T+ Compass
on:
  pull_request:
    paths: ['tplus-app/**', '.github/workflows/tplus-app.yml']
  push:
    paths: ['tplus-app/**', '.github/workflows/tplus-app.yml']
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tplus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tplus-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx tests/browser-smoke.mjs
